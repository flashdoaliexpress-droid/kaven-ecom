<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Kaven Ecom — Estrutura digital para lojas e profissionais. Escolha o caminho do seu negócio." />
<title>Kaven Ecom — Escolha o caminho do seu negócio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" href="src/Logos/Favicon.png" />
<style>
  :root {
    --color-primary: #071559;
    --color-bg-page: #FDFDFD;
    --color-text-primary: #111827;
    --color-text-secondary: #6B7280;
    --color-border: #E5E7EB;
    --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    --radius-pill: 999px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: var(--font-sans);
    background: var(--color-bg-page);
    color: var(--color-text-primary);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 24px;
  }

  /* ============================================================
     TELA DE CARREGAMENTO
     ============================================================ */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--color-bg-page);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    transition: opacity 0.5s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }

  .loader-logo {
    height: 60px;
    width: auto;
    animation: logoPulse 1.6s ease-in-out infinite;
  }
  @keyframes logoPulse {
    0%, 100% { opacity: 1; transform: translateY(0); }
    50% { opacity: 0.65; transform: translateY(-2px); }
  }

  .loader-bar {
    width: 200px;
    height: 4px;
    background: var(--color-border);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .loader-fill {
    height: 100%;
    width: 0;
    background: var(--color-primary);
    border-radius: var(--radius-pill);
    animation: loadFill 1.7s ease forwards;
  }
  @keyframes loadFill { to { width: 100%; } }

  /* ============================================================
     TELA DE ESCOLHA
     ============================================================ */
  .chooser {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.2s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chooser-logo {
    height: 64px;
    width: auto;
    margin-bottom: 48px;
  }

  .choices {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  /* Botão estilo CTA (igual ao .btn-cta do site) */
  .choice-btn {
    width: 100%;
    max-width: 340px;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: #17181A;
    color: #E5E5E5;
    border: 0.5px solid #313133;
    border-radius: var(--radius-pill);
    padding: 8px 32px 8px 8px;
    min-height: 60px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 0.02em;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    transition: transform 0.2s ease;
  }
  .choice-btn:hover { transform: scale(1.02); }

  .choice-dot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--color-primary);
    border: 2px solid var(--color-primary);
    box-shadow: 0 0 20px rgba(7, 21, 89, 0.6);
    flex-shrink: 0;
  }
  .choice-dot::after {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #fff;
  }

  @media (max-width: 640px) {
    .chooser-logo { height: 52px; margin-bottom: 40px; }
    .choice-btn { font-size: 15px; min-height: 56px; }
  }
</style>
</head>
<body>
  <!-- Tela de carregamento -->
  <div id="loader" role="status" aria-label="Carregando">
    <img src="src/Logos/Logo%20Principal.png" alt="Kaven Ecom" class="loader-logo" />
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>

  <!-- Tela de escolha -->
  <main class="chooser">
    <img src="src/Logos/Logo%20Principal.png" alt="Kaven Ecom" class="chooser-logo" />
    <div class="choices">
      <a class="choice-btn" href="/ecom.html">
        <span class="choice-dot" aria-hidden="true"></span>
        <span>Sou dono de loja</span>
      </a>
      <a class="choice-btn" href="/profissionais.html">
        <span class="choice-dot" aria-hidden="true"></span>
        <span>Sou profissional</span>
      </a>
    </div>
  </main>

  <script>
    (function () {
      function hideLoader() {
        var l = document.getElementById('loader');
        if (!l) return;
        l.classList.add('hidden');
        setTimeout(function () { l.style.display = 'none'; }, 500);
      }
      // Esconde após a barra encher (~1.7s)
      window.setTimeout(hideLoader, 1900);
    })();
  </script>
</body>
</html>
